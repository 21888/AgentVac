name: Source-native Electron fixture verification

# Deliberately manual only: no push, pull_request, tag or scheduled trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentvac-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Source-native ${{ matrix.platform }} ${{ matrix.arch }}
    # Execution bound only; verified account spending controls remain separate.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux
            arch: x64
          - os: windows-2022
            platform: Windows
            arch: x64
          - os: macos-15-intel
            platform: macOS
            arch: x64
          - os: macos-15
            platform: macOS
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      AGENTVAC_EXPECTED_ARCH: ${{ matrix.arch }}
      AGENTVAC_NATIVE_EVIDENCE_DIR: ${{ github.workspace }}/.qa/agentvac-native-${{ github.run_id }}-${{ github.run_attempt }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No dependency cache: avoids Actions cache storage usage.
      - name: Install locked dependencies
        timeout-minutes: 3
        run: npm ci --no-audit --no-fund
      - name: Check native harness syntax
        run: node --check scripts/desktop-e2e.mjs
      - name: Run fixture unit tests
        timeout-minutes: 6
        run: npm test
      - name: Build and typecheck source
        run: npm run build
      - name: Install standard Linux desktop tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool openbox dbus-x11 libgtk-3-0 libnss3 libasound2 libgbm1 libglib2.0-bin xdg-utils
      - name: Native Linux window and OS integration
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- bash -c 'openbox >/tmp/agentvac-openbox.log 2>&1 & npm run test:desktop:built'
      - name: Native Windows or macOS window and OS integration
        timeout-minutes: 2
        if: runner.os != 'Linux'
        run: npm run test:desktop:built
      - name: Check fresh source-native coverage and summarize limitations
        if: always()
        run: node scripts/native-ci-summary.mjs
      # No package publishing, upload-artifact, cache, deployment or release steps.
