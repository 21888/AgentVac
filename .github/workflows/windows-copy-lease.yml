name: Standalone generated Windows copy-lease research
# Default is manual only. A reviewed temporary marker may trigger one source-only generated-fixture run.
on:
  push:
    branches: [master]
    paths:
      - '.github/agentvac-windows-copy-lease-sharefix-once-20261006.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentvac-windows-copy-lease-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generated-lease:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Build pinned lease helper and generated fixture executables
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "AGENTVAC_SDK_VERSION=%WindowsSDKVersion:\=%"
          "%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -File qa\windows-copy-lease\scripts\build-lease-windows.ps1 -CompilerPath "%VCToolsInstallDir%bin\Hostx64\x64\cl.exe" -Architecture x64 -ExpectedSdkVersion "10.0.26100.0" -ExpectedSourceTreeSha256 "05e1a6a6ce74c67073436e14c1e57b1f94504d2d5c0e187f472164381ea93385"
          if errorlevel 1 exit /b 1
      - name: Record exact source and compiled binary provenance
        shell: pwsh
        run: |
          $p = Get-Content -LiteralPath .\qa\windows-copy-lease\build\windows-x64\lease-build-provenance.json -Raw | ConvertFrom-Json
          [ordered]@{
            sourceTreeSha256=$p.sourceTreeSha256; sourcePrePostMatched=$p.sourcePrePostMatched
            compilerVersion=$p.compilerVersion; compilerSha256=$p.compilerSha256
            sdkVersion=$p.sdkVersion; targetArchitecture=$p.targetArchitecture
            helperSha256=$p.helperSha256; holderSha256=$p.holderSha256
            fixtureBuild=$p.fixtureBuild; fixtureSha256=$p.fixtureSha256
          } | ConvertTo-Json -Compress
      - name: Pure policy tests on Windows compiler
        shell: pwsh
        run: |
          & .\qa\windows-copy-lease\build\windows-x64\core-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\qa\windows-copy-lease\build\windows-x64\inherited-policy-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\qa\windows-copy-lease\build\windows-x64\lease-core-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Host lifecycle and protocol regressions
        shell: pwsh
        run: |
          & 'C:\Program Files\nodejs\node.exe' --test .\qa\windows-copy-lease\tests\lease-copy.test.mjs .\qa\windows-copy-lease\tests\lease-delete-holder.test.mjs .\qa\windows-copy-lease\tests\lease-oracles.test.mjs .\qa\windows-copy-lease\tests\lease-protocol.test.mjs .\qa\windows-copy-lease\tests\lease-real-exit.test.mjs .\qa\windows-copy-lease\tests\lease-transport.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact-helper generated sentinel-copy probe
        shell: pwsh
        run: |
          & 'C:\Program Files\nodejs\node.exe' .\qa\windows-copy-lease\scripts\native-lease.mjs '05e1a6a6ce74c67073436e14c1e57b1f94504d2d5c0e187f472164381ea93385' '10.0.26100.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
# No upload, release, app integration, privilege enablement, alternate login,
# account/UAC changes, existing ACL writes, provider data or recursive cleanup.
